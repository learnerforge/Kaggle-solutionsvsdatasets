# =============================================================================
# Daily problem-statement cycle (24-hour clock)
#
# Every day the engine picks the next unsolved competition (or a slug you pin),
# scouts its sources, triggers OpenCode to write/repair the notebook, executes
# it, checks the score gate and reports. Artifacts are uploaded and the
# competition sources + dashboard are committed back.
#
# Required repository secrets
#   KAGGLE_USERNAME / KAGGLE_KEY   Kaggle API credentials (account must have
#                                  joined each competition — rule acceptance is
#                                  per-competition and cannot be automated).
#   <PROVIDER>_API_KEY             the key OpenCode's coder model needs, e.g.
#                                  ANTHROPIC_API_KEY or OPENAI_API_KEY.
#
# Optional repository variables
#   DAILY_SLUG                     pin one competition (else: next unsolved)
#   ENGINE_SUBMIT_ENABLED          "1" to allow real Kaggle submissions (R9)
#   ENGINE_MAX_ATTEMPTS            coder attempts per cycle (default 3)
#   ENGINE_OPENCODE_MODEL          e.g. "anthropic/claude-sonnet-4"
# =============================================================================

name: daily-cycle

on:
  schedule:
    - cron: "17 3 * * *"   # once every 24 hours, 03:17 UTC
  workflow_dispatch:
    inputs:
      slug:
        description: "Competition slug (empty = next unsolved)"
        required: false
        default: ""
      dry_run:
        description: "Scout + write prompts only (no coder, no training)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      ENGINE_SUBMIT_ENABLED: ${{ vars.ENGINE_SUBMIT_ENABLED || '0' }}
      ENGINE_MAX_ATTEMPTS: ${{ vars.ENGINE_MAX_ATTEMPTS || '3' }}
      ENGINE_OPENCODE_MODEL: ${{ vars.ENGINE_OPENCODE_MODEL || '' }}
      # Never let the pipeline stall on a prompt or a big dataset download.
      ENGINE_NOTEBOOK_TIMEOUT: "5400"
      ENGINE_OPENCODE_TIMEOUT: "1800"
      SLUG: ${{ inputs.slug || vars.DAILY_SLUG || '' }}
      DRY_RUN: ${{ inputs.dry_run == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m ipykernel install --user --name python3

      - name: Set up Node (OpenCode coder)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode
        run: npm install -g opencode-ai@latest

      # The coder needs a provider key. opencode picks it up from the
      # environment (ANTHROPIC_API_KEY / OPENAI_API_KEY / ...). Set whichever
      # secret matches your default provider — the engine never passes keys on
      # the command line (rule R12).

      - name: Verify credentials and rulebook
        run: |
          python -m engine status
          python -m engine rules | head -20
          kaggle --version

      - name: Run the cycle
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="--dry-run"
          else
            FLAGS=""
          fi
          if [ -n "$SLUG" ]; then
            python -m engine cycle "$SLUG" --json $FLAGS
          else
            python -m engine cycle --json $FLAGS
          fi

      - name: Refresh dashboard
        if: always()
        run: python -m engine report

      - name: Upload run artifacts (datasets excluded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-${{ github.run_id }}
          path: |
            competition/**/train/**
            competition/**/PROBLEM_STATEMENT.md
            competition/**/BRIEF.md
            frontend/data/dashboard.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit competition sources and dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add competition frontend/data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "cycle: update competition sources and dashboard [skip ci]"
            git push
          fi
